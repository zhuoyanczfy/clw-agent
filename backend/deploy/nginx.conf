# Nginx 站点配置（模板）
# 用法：复制到 /etc/nginx/sites-available/foodmap.conf，把 server_name 换成你的域名，
#      再 ln -s 到 sites-enabled，nginx -t && systemctl reload nginx
#      最后用 certbot --nginx -d 你的域名 签发 HTTPS（自动改写此文件）

server {
    listen 80;
    server_name 你的域名;

    # 多图上传限制（单张常见手机照片 3-8M，多张放宽到 20M）
    client_max_body_size 20m;

    # Django 静态文件（collectstatic 产物）
    location /static/ {
        alias /opt/foodmap/app/staticfiles/;
    }

    # 用户上传的用餐照片
    location /media/ {
        alias /opt/foodmap/app/media/;
    }

    # Django 应用（Gunicorn）
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 推荐是 SSE 流式响应，必须关闭缓冲，否则打字机效果会变成一次性输出
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
